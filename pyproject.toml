[project]
name = "zorathvael-os"
version = "0.1.0"
description = "Zorathvael OS - AI operating system and live futures scanner"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "pydantic==2.6.4",
    "requests==2.31.0",
    "python-dotenv==1.0.1",
    "openai==1.14.1",
    "google-generativeai==0.4.1",
    "anthropic==0.20.0",
]

[tool.fastapi]
entrypoint = "api.main:app"
