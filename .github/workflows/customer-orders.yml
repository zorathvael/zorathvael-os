name: Zorathvael Customer Orders

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  intake:
    if: >-
      (github.event_name == 'issues' &&
       contains(github.event.issue.title, '[ORDER]')) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.comment.body, '0x'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Process order or payment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_COMMENT: ${{ github.event.comment.body }}
          ZORATHVAEL_PROFIT_LEDGER: data/profit_ledger.jsonl
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            PYTHONPATH=. python scripts/order_intake.py --issue-number "$ISSUE_NUMBER" --body "$ISSUE_BODY" > /tmp/order.json
            TX_HASH="$(printf '%s' "$ISSUE_BODY" | grep -Eio '0x[a-fA-F0-9]{64}' | head -n1 || true)"
            if [ -n "$TX_HASH" ]; then
              PYTHONPATH=. python scripts/process_payment_comment.py --issue-number "$ISSUE_NUMBER" --comment "TX: $TX_HASH" > /tmp/payment.json
              ISSUE_NUMBER="$ISSUE_NUMBER" python - <<'PY'
              import json, os, subprocess
              p=json.load(open("/tmp/payment.json"))
              issue=os.environ["ISSUE_NUMBER"]
              if p.get("verified"):
                  body = f"Payment verified for order **{p.get('order_id','unknown')}**. The product has been generated and queued for autonomous AgentMail delivery. No manual delivery action is required."
              elif p.get("status") == "pending":
                  body = "Payment detected but is still awaiting required BSC confirmations. The automation will retry."
              elif p.get("status") == "rejected":
                  body = f"Payment verification rejected: {p.get('reason','unknown reason')}"
              else:
                  body = p.get("reason", "Order received; payment verification will continue.")
              subprocess.run(["gh","issue","comment",issue,"--body",body],check=True)
              PY
            else
              ISSUE_NUMBER="$ISSUE_NUMBER" python - <<'PY'
              import json, os, subprocess
              p=json.load(open("/tmp/order.json"))
              issue=os.environ["ISSUE_NUMBER"]
              body = "\n".join([
                  "## Payment instructions","",
                  f"**Order:** {p['order_id']}","",
                  f"**Product:** {p['product_id']}","",
                  f"**Amount:** {p['amount']} {p['currency']}","",
                  f"**Method:** {p['method']}","",
                  f"**Destination:** {p['destination']}","",
                  f"**Expires:** {p['expires_at']}","",
                  "After payment, comment on this issue with the BSC transaction hash:","",
                  "TX: 0xYOUR_64_CHARACTER_BSC_TRANSACTION_HASH","",
                  "The system verifies the transfer before recording revenue and starting autonomous delivery.","",
                  "Do not post private keys, seed phrases, passwords, or API tokens.",
              ])
              subprocess.run(["gh","issue","comment",issue,"--body",body],check=True)
              PY
            fi
          else
            PYTHONPATH=. python scripts/process_payment_comment.py --issue-number "$ISSUE_NUMBER" --comment "$ISSUE_COMMENT" > /tmp/payment.json
            ISSUE_NUMBER="$ISSUE_NUMBER" python - <<'PY'
            import json, os, subprocess
            p=json.load(open("/tmp/payment.json"))
            issue=os.environ["ISSUE_NUMBER"]
            status=p.get("status")
            if p.get("verified"):
                body = f"Payment verified for order **{p.get('order_id','unknown')}**. The product has been generated and queued for autonomous AgentMail delivery. No manual delivery action is required."
            elif status == "pending":
                body = "Payment detected but still awaiting required BSC confirmations. The payment scanner will retry automatically."
            elif status == "rejected":
                body = f"Payment verification rejected: {p.get('reason','unknown reason')}"
            else:
                body = p.get("reason", "Payment update received; the automation will continue monitoring.")
            subprocess.run(["gh","issue","comment",issue,"--body",body],check=True)
            PY
          fi
      - name: Persist order and ledger state
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            git config user.name "zorathvael"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: persist revenue order state"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                git push origin HEAD:main && exit 0
              fi
              git rebase --abort || true
              git reset --hard origin/main
              echo "Retrying state persistence..."
            done
            exit 1
          else
            echo "No revenue state changes."
          fi
