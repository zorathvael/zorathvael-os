name: Zorathvael Revenue Acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: zorathvael-revenue-acquisition
  cancel-in-progress: false

jobs:
  discover-and-rank:
    if: >-
      (github.event_name != 'issues' ||
       (github.event.issue.title == '[REVENUE-RUN]' && github.actor == 'zorathvael'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run revenue acquisition engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZORATHVAEL_LEAD_LIMIT: "20"
        run: PYTHONPATH=. python scripts/revenue_cycle.py
      - name: Discover public contact channels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZORATHVAEL_CONTACT_DISCOVERY_LIMIT: "10"
        run: PYTHONPATH=. python scripts/discover_contacts.py
      - name: Validate outreach transport
        env:
          ZORATHVAEL_OUTREACH_TOKEN: ${{ secrets.ZORATHVAEL_OUTREACH_TOKEN }}
          ZORATHVAEL_SMTP_HOST: ${{ secrets.ZORATHVAEL_SMTP_HOST }}
          ZORATHVAEL_SMTP_USERNAME: ${{ secrets.ZORATHVAEL_SMTP_USERNAME }}
          ZORATHVAEL_SMTP_PASSWORD: ${{ secrets.ZORATHVAEL_SMTP_PASSWORD }}
          ZORATHVAEL_EMAIL_FROM: ${{ secrets.ZORATHVAEL_EMAIL_FROM }}
        run: |
          if [ -z "$ZORATHVAEL_OUTREACH_TOKEN" ] && { [ -z "$ZORATHVAEL_SMTP_HOST" ] || [ -z "$ZORATHVAEL_SMTP_USERNAME" ] || [ -z "$ZORATHVAEL_SMTP_PASSWORD" ] || [ -z "$ZORATHVAEL_EMAIL_FROM" ]; }; then
            echo "::error::No external outreach transport is configured. Set ZORATHVAEL_OUTREACH_TOKEN (recommended) or complete SMTP secrets."
            exit 1
          fi
          if [ -n "$ZORATHVAEL_OUTREACH_TOKEN" ]; then
            echo "External GitHub outreach token is configured."
          else
            echo "SMTP outreach transport is configured; GitHub external comments require ZORATHVAEL_OUTREACH_TOKEN."
          fi
      - name: Execute qualified outreach
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZORATHVAEL_OUTREACH_TOKEN: ${{ secrets.ZORATHVAEL_OUTREACH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZORATHVAEL_OUTREACH_LIMIT: "2"
          ZORATHVAEL_SMTP_HOST: ${{ secrets.ZORATHVAEL_SMTP_HOST }}
          ZORATHVAEL_SMTP_PORT: ${{ secrets.ZORATHVAEL_SMTP_PORT }}
          ZORATHVAEL_SMTP_USERNAME: ${{ secrets.ZORATHVAEL_SMTP_USERNAME }}
          ZORATHVAEL_SMTP_PASSWORD: ${{ secrets.ZORATHVAEL_SMTP_PASSWORD }}
          ZORATHVAEL_EMAIL_FROM: ${{ secrets.ZORATHVAEL_EMAIL_FROM }}
        run: PYTHONPATH=. python scripts/execute_outreach.py
      - name: Persist acquisition state
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No acquisition state changes."
            exit 0
          fi
          git config user.name "zorathvael"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/revenue_leads.jsonl data/outreach_drafts.md data/revenue_metrics.json data/revenue_events.jsonl
          git commit -m "chore: refresh revenue acquisition queue"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main && exit 0
            fi
            git rebase --abort || true
            git reset --hard origin/main
            echo "Retrying acquisition state persistence..."
          done
          exit 1
