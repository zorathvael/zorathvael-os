name: Zorathvael Revenue Acquisition

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  discover-and-rank:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == '[REVENUE-RUN]' && github.actor == 'zorathvael')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run revenue acquisition engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZORATHVAEL_LEAD_LIMIT: "20"
        run: PYTHONPATH=. python scripts/revenue_cycle.py
      - name: Persist acquisition state
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            git config user.name "zorathvael"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/revenue_leads.jsonl data/outreach_drafts.md data/revenue_metrics.json
            git commit -m "chore: refresh revenue acquisition queue"
            git push
          else
            echo "No acquisition state changes."
          fi
