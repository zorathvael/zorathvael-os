name: Zorathvael Revenue Acquisition

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: zorathvael-revenue-acquisition
  cancel-in-progress: false

jobs:
  discover-and-rank:
    if: >-
      (github.event_name != 'issues' ||
       (github.event.issue.title == '[REVENUE-RUN]' && github.actor == 'zorathvael')) &&
      !(github.event_name == 'push' && github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run revenue acquisition engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZORATHVAEL_LEAD_LIMIT: "20"
        run: PYTHONPATH=. python scripts/revenue_cycle.py
      - name: Execute qualified outreach
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZORATHVAEL_OUTREACH_TOKEN: ${{ secrets.ZORATHVAEL_OUTREACH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZORATHVAEL_OUTREACH_LIMIT: "2"
        run: PYTHONPATH=. python scripts/execute_outreach.py

      - name: Persist acquisition state
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No acquisition state changes."
            exit 0
          fi

          git config user.name "zorathvael"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/revenue_leads.jsonl data/outreach_drafts.md data/revenue_metrics.json data/revenue_events.jsonl
          git commit -m "chore: refresh revenue acquisition queue"

          # The Core/revenue workflows can update main while this run is executing.
          # Rebase the state commit onto the latest main before pushing so a stale
          # checkout cannot fail with a non-fast-forward ref-lock rejection.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            git reset --hard origin/main
            PYTHONPATH=. python scripts/revenue_cycle.py
            git add data/revenue_leads.jsonl data/outreach_drafts.md data/revenue_metrics.json data/revenue_events.jsonl
            if ! git diff --cached --quiet; then
              git commit -m "chore: refresh revenue acquisition queue"
            fi
            git fetch origin main
            git rebase origin/main
          fi

          git push origin HEAD:main
