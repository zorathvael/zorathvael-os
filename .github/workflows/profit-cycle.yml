name: Zorathvael Profit Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: zorathvael-profit-cycle
  cancel-in-progress: false

jobs:
  profit-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run profit-engine tests
        run: PYTHONPATH=. pytest -q test/test_profit_engine.py
      - name: Execute economic selection cycle
        env:
          PYTHONPATH: .
          ZORATHVAEL_OPPORTUNITIES: '[{"name":"Crypto-Signal validation","kind":"market","expected_value":20.0,"cost":0.0,"probability":0.0,"effort_minutes":30,"risk":0.5,"evidence":{"mode":"measurement_only"}}]'
        run: python scripts/profit_cycle.py
