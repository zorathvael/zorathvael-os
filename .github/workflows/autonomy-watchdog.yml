name: Zorathvael Autonomy Watchdog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: zorathvael-autonomy-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect funnel and recover stale workers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone

          def load(path):
              try:
                  return [json.loads(x) for x in open(path, encoding="utf-8") if x.strip()]
              except FileNotFoundError:
                  return []

          orders = load("data/revenue_orders.jsonl")
          now = datetime.now(timezone.utc)
          counts = {}
          stale = {"payment": False, "delivery": False, "recovery": False}

          for o in orders:
              status = o.get("status", "unknown")
              counts[status] = counts.get(status, 0) + 1
              stamp = o.get("updated_at") or o.get("created_at")
              if not stamp:
                  continue
              try:
                  age = (now - datetime.fromisoformat(stamp.replace("Z","+00:00"))).total_seconds() / 60
              except ValueError:
                  continue
              if status == "pending" and age >= 15:
                  stale["payment"] = True
              if status == "delivery_ready" and age >= 10:
                  stale["delivery"] = True
              if status == "delivery_pending" and age >= 10:
                  stale["recovery"] = True

          def latest_run(workflow):
              out = subprocess.check_output(
                  ["gh","run","list","--workflow",workflow,"--limit","1",
                   "--json","status,conclusion,createdAt,databaseId"],
                  text=True,
              )
              rows=json.loads(out)
              return rows[0] if rows else None

          def dispatch(workflow):
              subprocess.run(["gh","workflow","run",workflow,"--ref","main"],check=True)

          actions=[]
          if stale["payment"]:
              dispatch("payment-verification.yml")
              actions.append("payment-verification")
          if stale["delivery"]:
              dispatch("autonomous-email-delivery.yml")
              actions.append("autonomous-email-delivery")
          if stale["recovery"]:
              dispatch("delivery-recovery.yml")
              actions.append("delivery-recovery")

          snapshot={
              "checked_at": now.isoformat(),
              "orders": counts,
              "stale": stale,
              "actions": actions,
              "workers": {
                  name: latest_run(name)
                  for name in [
                      "payment-verification.yml",
                      "autonomous-email-delivery.yml",
                      "delivery-recovery.yml",
                      "revenue-cycle.yml",
                  ]
              },
          }
          with open("data/autonomy_health.json","w",encoding="utf-8") as f:
              json.dump(snapshot,f,indent=2,sort_keys=True)
              f.write("\n")
          print(json.dumps(snapshot,indent=2,sort_keys=True))
          PY

      - name: Persist autonomy health
        run: |
          if [ -n "$(git status --porcelain -- data/autonomy_health.json)" ]; then
            git config user.name "zorathvael"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/autonomy_health.json
            git commit -m "chore: persist autonomy health"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                git push origin HEAD:main && exit 0
              fi
              git rebase --abort || true
              git reset --hard origin/main
              echo "Retrying watchdog state persistence..."
            done
            exit 1
          fi
