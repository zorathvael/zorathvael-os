name: Zorathvael Portal Order Intake

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"

permissions:
  contents: write

concurrency:
  group: zorathvael-portal-order-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WPS_TOKEN: ${{ secrets.WPS_TOKEN }}
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZORATHVAEL_USDT_BEP20_ADDRESS: "0x4ce7004e7127f8b2386eb355e088f127c24b3fac"
      ZORATHVAEL_PAYMENT_ORDERS: "data/revenue_orders.jsonl"
      ZORATHVAEL_PROFIT_LEDGER: "data/profit_ledger.jsonl"
      ZORATHVAEL_WP_PROJECT_ID: "29784"
      ZORATHVAEL_WP_FORM_NAME: "order_portal"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check portal bridge configuration
        id: config
        run: |
          if [ -z "$WPS_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "WPS_TOKEN is not configured; portal intake is safely skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Portal intake bridge is configured."
          fi
      - name: Ingest portal orders and verify payments
        if: steps.config.outputs.configured == 'true'
        run: PYTHONPATH=. python scripts/portal_order_intake.py | tee /tmp/portal-order-intake.json
      - name: Persist order, payment and delivery state
        if: steps.config.outputs.configured == 'true'
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "zorathvael"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: persist portal order state"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main && exit 0
            fi
            git rebase --abort || true
            git reset --hard origin/main
            echo "Retrying state persistence..."
          done
          exit 1
