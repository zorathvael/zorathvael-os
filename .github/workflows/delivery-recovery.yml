name: Zorathvael Delivery Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: "53 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: zorathvael-delivery-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Retry product generation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from lib.profit_engine.order_flow import load_orders, mark_status
          from lib.profit_engine.settlement import deliver_order

          results = []
          for order in load_orders():
              if order.status not in {"paid", "delivery_pending"}:
                  continue
              delivery_path = Path(f"data/delivery_{order.order_id}.md")
              if order.status == "paid" and delivery_path.exists() and "Delivery pending" not in delivery_path.read_text(encoding="utf-8"):
                  mark_status(order.order_id, "delivery_ready")
                  continue
              try:
                  ok, path = deliver_order(order)
                  if ok:
                      mark_status(order.order_id, "delivery_ready")
                      results.append({"order_id": order.order_id, "issue_number": order.issue_number, "status": "delivery_ready", "path": path})
              except Exception as exc:
                  results.append({"order_id": order.order_id, "issue_number": order.issue_number, "status": "pending", "error": type(exc).__name__})
          Path("/tmp/delivery-recovery.json").write_text(json.dumps({"results": results}, indent=2), encoding="utf-8")
          print(json.dumps({"results": results}, indent=2))
          PY
      - name: Persist recovery state
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then exit 0; fi
          git config user.name "zorathvael"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: recover delivery-ready state"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main && exit 0
            fi
            git rebase --abort || true
            git reset --hard origin/main
          done
          exit 1
