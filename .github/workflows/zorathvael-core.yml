name: Zorathvael Core

on:
  workflow_dispatch:
    inputs:
      lead_limit:
        description: "Maximum public GitHub issues to inspect per query"
        required: false
        default: "20"
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: zorathvael-core
  cancel-in-progress: false

jobs:
  run-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Core before execution
        run: PYTHONPATH=. pytest -q test/
      - name: Run Zorathvael Core master orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZORATHVAEL_LEAD_LIMIT: ${{ inputs.lead_limit }}
          ZORATHVAEL_OUTREACH_TOKEN: ${{ secrets.ZORATHVAEL_OUTREACH_TOKEN }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
        run: |
          PYTHONPATH=. python scripts/core_orchestrator.py | tee /tmp/core-result.json
      - name: Publish Core result
        if: always()
        run: |
          {
            echo "## Zorathvael Core"
            echo
            echo "**Mode:** Master orchestrator"
            echo "**Status:** ${{ job.status }}"
            echo
            echo '```json'
            cat /tmp/core-result.json 2>/dev/null || echo '{"status":"no orchestrator output"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist Core state
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            git config user.name "zorathvael"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: persist zorathvael core state" || true
            git push || true
          else
            echo "No Core state changes."
          fi
