name: Zorathvael Core

on:
  workflow_dispatch:
    inputs:
      lead_limit:
        description: "Maximum public GitHub issues to inspect per query"
        required: false
        default: "20"
        type: string

permissions:
  contents: write

concurrency:
  group: zorathvael-core
  cancel-in-progress: false

jobs:
  run-core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Core before execution
        run: PYTHONPATH=. pytest -q test/

      - name: Run revenue acquisition engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZORATHVAEL_LEAD_LIMIT: ${{ inputs.lead_limit }}
        run: |
          PYTHONPATH=. python scripts/revenue_cycle.py | tee /tmp/core-result.json

      - name: Publish Core result
        run: |
          {
            echo "## Zorathvael Core"
            echo
            echo "**Mode:** Revenue acquisition"
            echo "**Status:** execution completed"
            echo
            echo '```json'
            cat /tmp/core-result.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Persist Core state
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            git config user.name "zorathvael"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/revenue_leads.jsonl data/outreach_drafts.md data/revenue_metrics.json
            git commit -m "chore: run zorathvael core revenue acquisition"
            git push
          else
            echo "No Core state changes."
          fi
