name: Zorathvael Core

on:
  workflow_dispatch:
    inputs:
      lead_limit:
        description: "Maximum public GitHub issues to inspect per query"
        required: false
        default: "20"
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: zorathvael-core
  cancel-in-progress: false

jobs:
  run-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZORATHVAEL_LEAD_LIMIT: ${{ inputs.lead_limit }}
      ZORATHVAEL_OUTREACH_TOKEN: ${{ secrets.ZORATHVAEL_OUTREACH_TOKEN }}
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Core before execution
        run: PYTHONPATH=. pytest -q test/
      - name: Run Zorathvael Core master orchestrator
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/core_orchestrator.py | tee /tmp/core-result.txt
      - name: Publish Core result
        if: always()
        run: |
          {
            echo "## Zorathvael Core"
            echo
            echo "**Mode:** Master orchestrator"
            echo "**Status:** ${{ job.status }}"
            echo
            echo '```text'
            cat /tmp/core-result.txt 2>/dev/null || echo "No orchestrator output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist Core state
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No Core state changes."
            exit 0
          fi
          git config user.name "zorathvael"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: persist zorathvael core state"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main && exit 0
            fi
            git rebase --abort || true
            git reset --hard origin/main
            echo "Retrying Core state persistence..."
          done
          exit 1
