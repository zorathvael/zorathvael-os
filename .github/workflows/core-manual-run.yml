name: Zorathvael Core Manual Run

on:
  workflow_dispatch:
    inputs:
      lead_limit:
        description: "Maximum public GitHub issues to inspect"
        required: false
        default: "20"
        type: string
      contact_limit:
        description: "Maximum public contact candidates to inspect"
        required: false
        default: "10"
        type: string
      outreach_limit:
        description: "Maximum qualified outreach actions"
        required: false
        default: "3"
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: zorathvael-core-manual
  cancel-in-progress: false

jobs:
  run-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: \${{ github.repository }}
      ZORATHVAEL_OUTREACH_TOKEN: \${{ secrets.ZORATHVAEL_OUTREACH_TOKEN }}
      AGENTMAIL_API_KEY: \${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_INBOX_ID: \${{ secrets.AGENTMAIL_INBOX_ID }}
      ZORATHVAEL_LEAD_LIMIT: \${{ inputs.lead_limit }}
      ZORATHVAEL_CONTACT_DISCOVERY_LIMIT: \${{ inputs.contact_limit }}
      ZORATHVAEL_OUTREACH_LIMIT: \${{ inputs.outreach_limit }}
      ZORATHVAEL_GITHUB_DAILY_OUTREACH_LIMIT: "10"
      ZORATHVAEL_GITHUB_REPOSITORY_COOLDOWN_DAYS: "7"
      ZORATHVAEL_SMTP_HOST: \${{ secrets.ZORATHVAEL_SMTP_HOST }}
      ZORATHVAEL_SMTP_PORT: \${{ secrets.ZORATHVAEL_SMTP_PORT }}
      ZORATHVAEL_SMTP_USERNAME: \${{ secrets.ZORATHVAEL_SMTP_USERNAME }}
      ZORATHVAEL_SMTP_PASSWORD: \${{ secrets.ZORATHVAEL_SMTP_PASSWORD }}
      ZORATHVAEL_EMAIL_FROM: \${{ secrets.ZORATHVAEL_EMAIL_FROM }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify orchestrator definition
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from scripts.core_orchestrator import build_stages
          expected = [
              "revenue_acquisition",
              "contact_discovery",
              "qualified_outreach",
              "github_response_observation",
              "email_response_observation",
              "payment_verification",
              "delivery_recovery",
              "agentmail_delivery",
              "revenue_learning",
          ]
          actual = [stage.name for stage in build_stages()]
          print("Expected:", expected)
          print("Actual:  ", actual)
          if actual != expected:
              raise SystemExit("9-stage orchestrator definition mismatch")
          print("Verified: 9/9 stages are defined in order.")

      - name: Run 9/9 master orchestrator
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/core_orchestrator.py | tee /tmp/core-result.txt

      - name: Publish orchestrator result
        if: always()
        run: |
          {
            echo "## Zorathvael Core Manual Run"
            echo
            echo "Mode: 9/9 master orchestrator"
            echo "Status: \${{ job.status }}"
            echo
            echo "Orchestrator output:"
            cat /tmp/core-result.txt 2>/dev/null || echo "No orchestrator output."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist manual-run state
        if: always()
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- data)"
          if [ -z "$changes" ]; then
            echo "No Core state changes."
            exit 0
          fi

          echo "Detected Core state changes:"
          printf '%s\n' "$changes"

          git config user.name "zorathvael"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: persist manual core state"

          for attempt in 1 2 3; do
            echo "Persistence attempt $attempt/3"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Unable to rebase manual Core state onto origin/main; preserving state commit and stopping."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Manual Core state persisted successfully."
              exit 0
            fi

            echo "Remote main advanced during push; retrying..."
          done

          echo "::error::Failed to persist manual Core state after 3 attempts."
          exit 1
