name: Zorathvael Payment Verification

on:
  workflow_dispatch:
    inputs:
      order_id:
        description: "Existing order ID"
        required: false
        type: string
      amount:
        description: "Expected USDT amount"
        required: false
        type: string
      tx_hash:
        description: "Optional BSC transaction hash"
        required: false
        type: string
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZORATHVAEL_USDT_BEP20_ADDRESS: "0x4ce7004e7127f8b2386eb355e088f127c24b3fac"
      ZORATHVAEL_PAYMENT_ORDERS: "data/revenue_orders.jsonl"
      ZORATHVAEL_PROFIT_LEDGER: "data/profit_ledger.jsonl"
      ZORATHVAEL_SCAN_BLOCKS: "1500"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify supplied transaction
        if: inputs.tx_hash != '' && inputs.order_id != '' && inputs.amount != ''
        env:
          ZORATHVAEL_ORDER_ID: ${{ inputs.order_id }}
          ZORATHVAEL_PAYMENT_AMOUNT: ${{ inputs.amount }}
          ZORATHVAEL_PAYMENT_METHOD: "usdt_bep20"
          ZORATHVAEL_PAYMENT_CURRENCY: "USDT"
        run: |
          PYTHONPATH=. python scripts/verify_payment.py --tx-hash "${{ inputs.tx_hash }}" | tee /tmp/manual-payment.json
      - name: Notify verified manual payment
        if: inputs.tx_hash != '' && inputs.order_id != '' && inputs.amount != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          payload=json.load(open("/tmp/manual-payment.json",encoding="utf-8"))
          issue=payload.get("issue_number")
          if payload.get("verified") and issue:
              subprocess.run([
                  "gh","issue","comment",str(issue),"--body",
                  f"Payment verified for order **{payload.get('order_id','unknown')}**. "
                  "The product is queued for autonomous AgentMail delivery."
              ],check=True)
          PY
      - name: Scan pending USDT orders
        if: inputs.tx_hash == ''
        run: PYTHONPATH=. python scripts/scan_usdt_payments.py | tee /tmp/payment-scan.json
      - name: Notify verified scheduled payments
        if: inputs.tx_hash == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, subprocess
          payload=json.load(open("/tmp/payment-scan.json",encoding="utf-8"))
          for item in payload.get("results",[]):
              issue=item.get("issue_number")
              if item.get("status") in {"paid","delivery_ready"} and issue:
                  subprocess.run([
                      "gh","issue","comment",str(issue),"--body",
                      f"Payment verified for order **{item.get('order_id','unknown')}**. "
                      "The product is queued for autonomous AgentMail delivery."
                  ],check=True)
      - name: Persist payment state
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            git config user.name "zorathvael"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: persist payment verification state"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                git push origin HEAD:main && exit 0
              fi
              git rebase --abort || true
              git reset --hard origin/main
              echo "Retrying state persistence..."
            done
            exit 1
          else
            echo "No payment state changes."
          fi
