name: Zorathvael Autonomous Email Delivery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: zorathvael-autonomous-email-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate AgentMail configuration
        run: |
          PYTHONPATH=. python - <<'PY'
          import os
          from agentmail import AgentMail

          api_key = os.environ.get("AGENTMAIL_API_KEY", "").strip()
          inbox_id = os.environ.get("AGENTMAIL_INBOX_ID", "").strip()
          if not api_key:
              raise SystemExit("AGENTMAIL_API_KEY secret is missing")
          if not inbox_id:
              raise SystemExit("AGENTMAIL_INBOX_ID secret is missing")

          client = AgentMail(api_key=api_key)
          try:
              inbox = client.inboxes.get(inbox_id)
          except Exception as exc:
              body = getattr(exc, "body", {}) or {}
              code = body.get("code") if isinstance(body, dict) else None
              if code == "missing_permission":
                  message = str(body.get("message", "")).strip()
                  fix = str(body.get("fix", "")).strip()
                  print(
                      "AgentMail key is accepted but inbox_read is unavailable; "
                      "this is valid for a send-only delivery key."
                  )
                  if message:
                      print(f"AgentMail response: {message}")
                  if fix:
                      print(f"AgentMail permission note: {fix}")
              else:
                  raise
          else:
              resolved = str(getattr(inbox, "inbox_id", "") or "")
              if resolved != inbox_id:
                  raise SystemExit(
                      f"AgentMail inbox mismatch: configured={inbox_id!r} resolved={resolved!r}"
                  )
              print(f"AgentMail authenticated; inbox={resolved}")
          PY
      - name: Send ready deliveries
        run: PYTHONPATH=. python scripts/send_delivery_email.py | tee /tmp/email-delivery.json
      - name: Persist delivery state
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No delivery state changes."
            exit 0
          fi
          git config user.name "zorathvael"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: persist autonomous email delivery state"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main && exit 0
            fi
            git rebase --abort || true
            git reset --hard origin/main
            echo "Retrying state persistence..."
          done
          exit 1
