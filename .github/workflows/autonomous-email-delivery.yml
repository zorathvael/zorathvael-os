name: Zorathvael Autonomous Email Delivery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: zorathvael-autonomous-email-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send ready deliveries
        run: PYTHONPATH=. python scripts/send_delivery_email.py | tee /tmp/email-delivery.json
      - name: Persist delivery state
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No delivery state changes."
            exit 0
          fi
          git config user.name "zorathvael"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: persist autonomous email delivery state"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main && exit 0
            fi
            git rebase --abort || true
            git reset --hard origin/main
            echo "Retrying state persistence..."
          done
          exit 1
