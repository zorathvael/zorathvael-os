name: Deploy Zorathvael Order Portal

on:
  push:
    branches: [main]
    paths:
      - "docs/order/**"
      - ".github/workflows/deploy-order-portal.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-order-portal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload order portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/order
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
